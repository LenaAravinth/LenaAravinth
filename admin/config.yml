backend:
  name: git-gateway
  branch: main

media_folder: "images"

collections:
  - name: "portfolio"
    label: "My Portfolio Content"
    files:
      - label: "About Me"
        name: "about"
        file: "content/about.json"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Bio", name: "bio", widget: "text"}
